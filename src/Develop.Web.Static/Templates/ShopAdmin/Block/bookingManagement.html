<div class="row" ng-controller="bookingManagementCtrl">
    <div class="col-sm-12">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Customer</th>
                    <th>Service</th>
                    <th>Booking time</th>
                    <th>State</th>
                    <th>Confirm</th>
                    <th>Reject</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="appointment in appointments">
                    <td>{{$index+1}}</td>
                    <td>{{appointment.applicantId}}</td>
                    <td>{{appointment.serviceId}}</td>
                    <td>{{appointment.applicationTime * 1000 | date:"dd-MMM-yyyy,EEE HH:mm"}}</td>
                    <td>{{appointment.approvalResult}}</td>
                    <td><button class="btn btn-success" ng-click="confirm($index)">confirm</button></td>
                    <td>
                        <button class="btn btn-danger" ng-click="reject($index)" ng-if="!appointment.rejectReason">reject</button>
                        <span ng-if="appointment.rejectReason">{{appointment.rejectReason}}</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script type="text/ng-template" id="reject.modal.html">
    <div class="modal-header">
        <h3 class="modal-title">{{appointment.serviceId}}</h3>
    </div>
    <div class="modal-body">
        <form role="form" name="rejectReasonForm" novalidate>
            <div class="form-group">
                <label>Reject reason:</label>
                <select class="form-control" ng-model="reason" ng-options="item.value as item.description for item in reasons" required id="reject.modal.form.select.reason">
                    <option value="">-- choose a reason --</option>
                </select>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" type="button" ng-click="reject()" ng-disabled="rejectReasonForm.$invalid">Reject</button>
        <button class="btn btn-warning" type="button" ng-click="cancel()">Cancel</button>
    </div>
</script>
